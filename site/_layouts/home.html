---
layout: default
---

<section class="hero">
  <div class="container">
    <p class="hero-eyebrow">Modded 2016 Roblox engine</p>
    <h1 class="hero-title">{{ site.title }}</h1>
    <p class="hero-tagline">{{ site.description | escape }}</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="{{ '/docs/' | relative_url }}">Read the docs</a>
      <a class="btn" href="{{ '/docs/getting-started/' | relative_url }}">Getting started</a>
      <a class="btn" href="https://github.com/havaianasdestruido/R2K16">GitHub ↗</a>
    </div>
  </div>
</section>

<div class="container content">
  {{ content }}
</div>
