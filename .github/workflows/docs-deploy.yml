# Builds and deploys the R2K16 GitHub Pages site:
#
#   https://havaianasdestruido.github.io/R2K16/        <- primary webpage (Jekyll, site/)
#   https://havaianasdestruido.github.io/R2K16/docs/   <- documentation (Docusaurus, website/)
#
# The documentation is generated from the codebase using Python scripts in scripts/docgen/
# to automatically detect and document newly added functions, test cases, and platform variants.
#
# The two are built separately and merged into a single Pages artifact:
#   1. Python generates the comprehensive function and test docs in website/docs/codebase/
#   2. Docusaurus in website/ is built with baseUrl /R2K16/docs/
#   3. Jekyll in site/ is built with actions/jekyll-build-pages
#   4. Docusaurus output is mounted under /docs/ of the Jekyll output
#
# Requires Pages to be enabled in the repository settings with
# Source: GitHub Actions.
name: Deploy website and docs

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "website/**"
      - "scripts/**"
      - "Base/**"
      - "App/**"
      - "Network/**"
      - "Rendering/**"
      - "ClientShared/**"
      - "ClientBase/**"
      - "CSG/**"
      - "WindowsClient/**"
      - "Win/**"
      - "RobloxStudio/**"
      - "RCCService/**"
      - "XboxClient/**"
      - "Roblox.RccServiceArbiter/**"
      - "RbxTestHooks/**"
      - "App.UnitTest/**"
      - "Base.UnitTest/**"
      - "RobloxTest/**"
      - "Roblox.Test/**"
      - "RCCService.Test/**"
      - "tests/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

# Allow only one concurrent deployment, but don't cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # actions/configure-pages reads Pages site metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a6004b88259ca6 # v5
        with:
          python-version: "3.12"

      - name: Generate Codebase Documentation
        run: python3 scripts/generate_docs.py

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install docs dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation site (served under /docs/)
        working-directory: website
        run: npm run build # baseUrl defaults to /R2K16/docs/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build primary webpage with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./site
          destination: ./_site

      - name: Mount the docs under /docs/
        run: |
          # jekyll-build-pages runs in a Docker container as root, so _site is
          # owned by root. Hand it back to the runner before writing into it.
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/docs
          cp -a website/build/. _site/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  deploy:
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
