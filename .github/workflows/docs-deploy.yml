# Builds and deploys the R2K16 GitHub Pages site:
#
#   https://havaianasdestruido.github.io/R2K16/        <- primary webpage (Jekyll, site/)
#   https://havaianasdestruido.github.io/R2K16/docs/   <- documentation (Docusaurus, website/)
#
# The two are built separately and merged into a single Pages artifact:
#   1. The Jekyll site in site/ is built with actions/jekyll-build-pages —
#      the same Jekyll engine GitHub Pages itself uses for branch deploys.
#   2. The Docusaurus site in website/ is built with baseUrl /R2K16/docs/
#      (docs-only mode) and copied under /docs/ of the Jekyll output.
#
# Requires Pages to be enabled in the repository settings with
# Source: GitHub Actions.
name: Deploy website and docs

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "website/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

# Allow only one concurrent deployment, but don't cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # actions/configure-pages reads Pages site metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install docs dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation site (served under /docs/)
        working-directory: website
        run: npm run build # baseUrl defaults to /R2K16/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # jekyll-build-pages is a Docker action running as root, so everything it
      # writes is owned by root:root (0755). Build into a scratch directory and
      # assemble the final _site as the runner user below, otherwise creating
      # _site/docs fails with "Permission denied".
      - name: Build primary webpage with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_jekyll

      - name: Assemble Pages artifact with the docs under /docs/
        run: |
          set -euo pipefail
          test -d _jekyll || { echo "::error::Jekyll output _jekyll/ is missing"; exit 1; }
          test -d website/build || { echo "::error::Docusaurus output website/build/ is missing"; exit 1; }
          rm -rf _site
          mkdir -p _site
          # cp -a from the root-owned tree is fine: as a non-root user cp skips
          # preserving ownership, so the copies belong to the runner user.
          cp -a _jekyll/. _site/
          mkdir -p _site/docs
          cp -a website/build/. _site/docs/
          test -f _site/index.html
          test -f _site/docs/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
