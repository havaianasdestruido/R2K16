# Builds and deploys the R2K16 GitHub Pages site:
#
#   https://havaianasdestruido.github.io/R2K16/        <- primary webpage (Jekyll, site/)
#   https://havaianasdestruido.github.io/R2K16/docs/   <- documentation (Docusaurus, website/)
#
# The two are built separately and merged into a single Pages artifact:
#   1. The Jekyll site in site/ is built with actions/jekyll-build-pages —
#      the same Jekyll engine GitHub Pages itself uses for branch deploys.
#   2. The Docusaurus site in website/ is built with baseUrl /R2K16/docs/
#      (docs-only mode) and copied under /docs/ of the Jekyll output.
#
# All third-party actions are pinned to full commit SHAs so a moved tag cannot
# inject new code into a job that holds a Pages deployment token.
#
# Requires Pages to be enabled in the repository settings with
# Source: GitHub Actions.
name: Deploy website and docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow only one concurrent deployment, but don't cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # actions/configure-pages reads Pages site metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install reference generator dependencies
        run: python -m pip install -r website/scripts/requirements.txt

      - name: Test reference generator
        run: python -m unittest discover -s website/scripts -p 'test_*.py'

      - name: Install docs dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation site (served under /docs/)
        working-directory: website
        run: npm run build # baseUrl defaults to /R2K16/docs/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build primary webpage with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./site
          destination: ./_site

      - name: Mount the docs under /docs/
        run: |
          # jekyll-build-pages runs in a Docker container as root, so _site is
          # owned by root. Hand it back to the runner before writing into it.
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/docs
          cp -a website/build/. _site/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  deploy:
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
