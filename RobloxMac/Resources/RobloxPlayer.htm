<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
    <title>Roblox</title>
    <!--
      Legacy Mac player/debug harness.

      Security: this page used to load jQuery 1.4.2 and jQuery UI 1.8.2 from a
      third-party CDN over plain HTTP, with no Subresource Integrity. Any network
      attacker could replace that script and run code inside a page that has a
      native window.external bridge. All behaviour below is now implemented with
      plain DOM APIs, so no remote executable code is loaded. All Roblox URLs
      use HTTPS.
    -->
</head>
<body id="BODY1" style="padding: 0; margin: 0">
    <!-- Main -->
    <div id="Main" style="position: absolute; top: 0; left: 0; bottom: 0; right: 0; margin-bottom: 40px;
        margin-right: 200px; padding: 0 1px 1px 0">
    </div>
    <!-- TODO: nuke the Panel div when we don't need it for debugging -->
    <div id="Panel" style="position: absolute; top: 0; right: 0; bottom: 0; width: 200px;
        margin-bottom: 40px; overflow: auto; border-left-style: solid; border-width: 1px">
        <div id="outputPanel" style="width: 100%">
        </div>

        <script type="text/javascript">
            var traces = [];
            var traceIndex = 19;
            function trace(message) {
                var div = document.createElement('div');
                div.appendChild(document.createTextNode(message));
                document.getElementById('outputPanel').appendChild(div);

                if (traces.length < 20) {
                    traces.push(div);
                } else {
                    traceIndex += 1;
                    if (traceIndex === 20) traceIndex = 0;
                    var old = traces[traceIndex];
                    if (old && old.parentNode) old.parentNode.removeChild(old);
                    traces[traceIndex] = div;
                }
            }
        </script>

    </div>
    <!-- Taskbar -->
    <div id="Taskbar" style="background-color: Window; padding: 5px; height: 30px; position: absolute;
        left: 0; right: 0; bottom: 0; border-width: 1px;
        border-top-style: solid">
        <div id="CommonButtons" style="float: right; margin: 5px">
            <button onclick="window.external.IsFullscreen = !window.external.IsFullscreen; return false">
                Fullscreen</button>
            <button onclick="focusContent(); window.external.Quit(); return false">
                Quit</button>
        </div>
        <div id="block" style="float: right; background-color: #abc; width: 20px; height: 20px;
            margin: 5px">
        </div>

        <div id="GameButtons" style="display: inline">
            <button onclick="document.getElementById('roblox3D').DoVerb('ReportAbuse'); return false" style="display: inline">
                Report Abuse</button>
            <button onclick="showWeb(); return false">
                Leave Game</button>
            <div id="FPS" style="display: inline">
            </div>
        </div>
        <div id="WebButtons" style="display: none">
            <button id="playButton" onclick="play(); return false" style="display: inline">
                Play</button>
            <button id="createViewButton" onclick="createView(100); return false" style="display: inline">
                CreateView 100</button>
        </div>
    </div>
    <!-- Scripts -->

    <script type="text/javascript">
        var content = null;

        function show(id, visible) {
            var el = document.getElementById(id);
            if (el) el.style.display = visible ? 'inline' : 'none';
        }

        function hideThen(id, callback) {
            var el = document.getElementById(id);
            if (el) el.style.display = 'none';
            // Old jQuery code used a "slow" hide before the callback; keep a
            // short delay so callers still run after the layout settles.
            window.setTimeout(callback, 200);
        }

        function removeContent() {
            if (content && content.parentNode) content.parentNode.removeChild(content);
            content = null;
        }

        function focusContent() {
            var el = document.getElementById('roblox3D') || document.getElementById('robloxFrame');
            if (el && el.focus) el.focus();
        }

        var windowed = true;
        function create3D(callback) {
            removeContent();
            hideThen('WebButtons', function() {
                var main = document.getElementById('Main');
                main.innerHTML = '<object id="roblox3D" classid="CLSID:D7EB14E2-66D2-4A6E-A50A-666CBE7A7621" width="100%" height="100%"><param name="windowed" value="' +
                    (windowed ? 'true' : 'false') + '"></object>';
                windowed = !windowed;
                content = document.getElementById('roblox3D');

                content.WhenReady({
                    success: function(result) {
                        focusContent();
                        callback();
                        show('GameButtons', true);
                    },
                    error: showWeb
                });
            });
        }

        function createView(count) {
            if (count === 0) return;
            create3D(function() {
                window.setTimeout(function() {
                    trace("CreateView " + count);
                    showWeb(function() {
                        window.setTimeout(function() {
                            createView(count - 1);
                        }, 1000);
                    });
                }, 1000);
            });
        }

        function getRobloxBrowserUrl() {
            var iframe = document.getElementById("robloxFrame");
            return iframe.contentWindow.location.href;
        }

        function showWeb(callback) {
            if (document.getElementById('roblox3D')) {
                document.getElementById('roblox3D').ShutDown();
            }
            removeContent();
            hideThen('GameButtons', function() {
                var main = document.getElementById('Main');
                content = document.createElement('iframe');
                content.id = 'robloxFrame';
                content.setAttribute('width', '100%');
                content.setAttribute('frameborder', '0');

                var loaded = false;
                content.addEventListener('load', function() {
                    if (loaded) return;
                    loaded = true;
                    show('WebButtons', true);
                    if (callback) callback();
                });

                content.setAttribute('src', 'https://www.roblox.com/Games.aspx');
                main.appendChild(content);
                content.style.height = main.clientHeight + 'px';
            });
        }

        window.addEventListener('resize', function() {
            if (content) {
                content.style.height = document.getElementById('Main').clientHeight + 'px';
            }
        });

        function errorAlert(message, stack) {
            alert(message + '\n' + stack);
        }

        function bindFPS() {
            var roblox3D = document.getElementById('roblox3D');
            roblox3D.Lua("f = ... while true do local render = stats():FindFirstChild('Render') if render then f(render['3D CPU Total']:GetValueString()) end wait(1) end", {
                args: [function(value) {
                    if (value !== '?' && roblox3D.IsWindowless)
                        value = value + " windowless";
                    document.getElementById('FPS').innerText = value;
                } ],
                error: errorAlert
            });
        }

        // Loads the 3D view and then loads a game based on what was displayed in the iframe
        function play() {
            create3D(function() {
                bindFPS();
            });
        }

        // TODO: Nuke this when the Panel div goes away
        window.external.onStandardOut = function(type, message) { trace(message); };

        // Startup:
        window.addEventListener('load', play);
    </script>

</body>
</html>
