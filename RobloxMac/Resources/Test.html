<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
    <title>Roblox</title>
    <!-- No third-party scripts are loaded: the CDN copy of jQuery 1.4.2 was
         fetched over plain HTTP with no integrity check and is itself EOL. -->
</head>
<body id="BODY1" style="padding: 0; margin: 0">
    <div id="WebButtons">
        <button id="playButton" onclick="play(); return false" style="display: inline">
            Play</button>
    </div>
    <div id="outputPanel" style="width: 100%">
    output
    </div>

    <script type="text/javascript">
    var traces = [];
    var traceIndex = 19;

    function trace(message) {
        var outputPanel = document.getElementById('outputPanel');
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(message));
        outputPanel.appendChild(div);

        if (traces.length < 20) {
            traces.push(div);
        } else {
            traceIndex = traceIndex + 1;
            if (traceIndex === 20) traceIndex = 0;
            if (traces[traceIndex] && traces[traceIndex].parentNode) {
                traces[traceIndex].parentNode.removeChild(traces[traceIndex]);
            }
            traces[traceIndex] = div;
        }
    }

    function play() {
        trace("playing!");
        // This is a manual test harness. Never embed a real authentication
        // ticket in a source file: the ticket that used to be here was a
        // reusable credential committed to a public repository.
        trace(window.external.helloWorld());
        trace(window.external.IsRobloxAppIDE);
        trace(window.external.InstallHost);

        // Provide a ticket at runtime (window.rbxTestTicket) from a secure
        // local source; never store a reusable credential in this file.
        var ticket = window.rbxTestTicket || "";
        if (ticket) {
            window.external.StartGame(
                ticket,
                'https://sitetest.roblox.com/Login/Negotiate.ashx',
                'https://sitetest.roblox.com/Game/visit.ashx?PlaceID=2562360&upload=2562360'
            );
            trace("played!");
        } else {
            trace("No test ticket configured; set window.rbxTestTicket at runtime.");
        }
    }
    function go() {
        trace("hi there!");
    }
    window.addEventListener('load', go);
    </script>
</body>
</html>
